<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnote · Personal voice notes</title><link rel="stylesheet" href="/style.css"><body>
<header><div class="brand"><b class="mark">▥</b> Fieldnote</div><span class="local"><i></i> Local workspace</span></header>
<main><section class="intro"><small>PERSONAL WORKSPACE</small><h1>Voice notebook<span>.</span></h1><p>Capture a thought. Give it structure. Keep it close.</p></section>
<section class="capture"><div class="tabs"><button id="voice" class="active">♩ &nbsp; Voice note</button><button id="type">⌨ &nbsp; Text note</button></div>
<div id="studio"><div id="wave" aria-hidden="true"></div><div id="clock">00:00</div><button id="record"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4m-4 0h8"/></svg><span>Start recording</span></button><p id="hint">Tap to start capturing your thoughts</p></div>
<form id="composer" hidden><label for="draft">Your transcript</label><textarea id="draft" maxlength="80000" placeholder="What's on your mind?"></textarea><button>Save note</button></form><p id="status" role="status"></p></section>
<section class="library"><div class="libhead"><h2>Your notes <em id="count">0</em></h2><label class="search">⌕ <input id="query" type="search" placeholder="Search notes…" aria-label="Search notes"></label></div><div id="list"></div></section></main>
<dialog id="editor"><form method="dialog"><button class="close" aria-label="Close">×</button></form><label>Title<input id="title"></label><label>Formatted note<textarea id="body"></textarea></label><details><summary>Original transcript</summary><pre id="original"></pre></details><p id="stamp"></p><div class="actions"><button id="save">Save changes</button><button id="remove">Delete</button></div><p id="editError" role="alert"></p></dialog><script type="module" src="/app.js"></script></body></html>
